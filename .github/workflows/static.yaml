# .github/workflows/static.yml (or rename to deploy-main.yml)
name: Deploy Main to Pages (Custom Domain) # Updated name for clarity

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build for Main (Production) # Slightly more descriptive name for step
        run: bun run build
        # No VITE_PREVIEW_BUILD env var here, so vite.config.js uses base: '/'

      # --- NEW RECOMMENDED STEP ---
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # --------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4