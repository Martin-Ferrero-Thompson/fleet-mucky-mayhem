# .github/workflows/deploy-preview.yml
name: Deploy Preview to Pages

on:
  push:
    branches: ["develop"] # <--- Triggered by develop branch
  workflow_dispatch: # Optional: if you want to manually trigger preview deployments

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview" # Use a different concurrency group for preview if desired
  cancel-in-progress: true # Often for previews, you want the latest, so cancel old ones

jobs:
  deploy-preview: # Different job name
    environment:
      name: github-pages # The environment name is the same, but deploys to the non-custom-domain URL
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build for Preview
        run: npm run build
        env:
          VITE_PREVIEW_BUILD: 'true' # <--- KEY DIFFERENCE: Sets the env var for vite.config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4